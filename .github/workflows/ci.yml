name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install "ruff>=0.6,<1"
      - run: ruff check src tests scripts

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # Offline, deterministic providers: CI never needs a model API key or
      # downloads BGE weights.
      REPOPILOT_LLM_MODE: mock
      REPOPILOT_RAG_EMBEDDING_PROVIDER: deterministic
      REPOPILOT_RAG_RERANKER_PROVIDER: deterministic
      REPOPILOT_RAG_DOCUMENT_PARSER: text-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
      - name: Install CPU-only torch
        # sentence-transformers would otherwise pull multi-GB CUDA wheels.
        run: pip install "torch>=2.2,<3" --index-url https://download.pytorch.org/whl/cpu
      - name: Install package
        run: pip install -e ".[test]"
      - name: Unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Workflow evaluation (mock LLM end to end)
        run: python scripts/evaluate.py
      - name: Retrieval quality gate
        run: python scripts/evaluate_retrieval.py --min-recall 0.65 --min-mrr 0.6

  docker:
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: repopilot:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
