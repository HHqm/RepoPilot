[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
dynamic = ["version"]
description = "A collaborative multi-agent software company with project RAG and ZIP delivery."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "mcp>=1.9,<2",
  "openai>=1.100,<2",
  "pydantic>=2.7,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "qdrant-client>=1.18,<2",
  "sentence-transformers>=5.6,<6",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
# FastAPI's TestClient is built on httpx.
test = [
  "httpx>=0.27,<1",
]
dev = [
  "httpx>=0.27,<1",
  "ruff>=0.6,<1",
]
documents = [
  "numpy>=1.24,<2",
  "opencv-python>=4.10,<4.12",
  "docling>=2.115,<3",
]

[project.scripts]
repopilot = "repopilot.cli:main"
repopilot-mcp = "repopilot.mcp_server:main"

[tool.setuptools.dynamic]
version = { attr = "repopilot.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repopilot = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests", "scripts"]
extend-exclude = [".repopilot*", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = [
  # Long Chinese prompt strings and URLs read better unwrapped.
  "E501",
  # FastAPI declares request parameters with File(...)/Depends(...) defaults.
  "B008",
  # Keep explicit "utf-8" arguments; they document the wire format.
  "UP012",
]

[tool.ruff.lint.isort]
known-first-party = ["repopilot"]
lines-after-imports = 2
