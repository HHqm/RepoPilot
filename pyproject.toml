[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repopilot"
version = "0.6.0"
description = "A collaborative multi-agent software company with project RAG and ZIP delivery."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "langgraph>=1.0,<2",
  "langgraph-checkpoint-sqlite>=3,<4",
  "mcp>=1.9,<2",
  "openai>=1.100,<2",
  "pydantic>=2.7,<3",
  "pypdf>=6,<7",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1,<2",
  "qdrant-client>=1.18,<2",
  "sentence-transformers>=5.6,<6",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "httpx2>=2.9,<3",
]
documents = [
  "numpy>=1.24,<2",
  "opencv-python>=4.10,<4.12",
  "docling>=2.115,<3",
]

[project.scripts]
repopilot = "repopilot.cli:main"
repopilot-mcp = "repopilot.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
repopilot = ["web/*.html", "web/*.css", "web/*.js", "web/*.svg"]
