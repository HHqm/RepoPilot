services:
  qdrant:
    image: qdrant/qdrant:v1.18.3
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  repopilot:
    build: .
    # Bound to loopback like Qdrant. Requests from the host reach the container
    # through the Docker bridge, so set REPOPILOT_API_TOKEN in .env.
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      REPOPILOT_QDRANT_URL: http://qdrant:6333
      REPOPILOT_WORKSPACE_ROOTS: /workspace
    volumes:
      # Named volume keeps ownership compatible with the non-root image user.
      - repopilot_data:/app/.repopilot
      - ./workspace:/workspace
    depends_on:
      - qdrant
    restart: unless-stopped

volumes:
  qdrant_data:
  repopilot_data:
